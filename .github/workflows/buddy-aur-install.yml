name: Lexora Desktop Arch Install

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libgtk-layer-shell-dev libxdo-dev rpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:buddy
      - uses: actions/upload-artifact@v4
        with:
          name: lexora-buddy-deb
          path: apps/buddy/.output/artifacts/desktop/Lexora-Buddy-*-linux-amd64.deb
          if-no-files-found: error

  arch-install:
    needs: build-deb
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install Arch packaging tools
        run: pacman -Syu --noconfirm base-devel git sudo xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          name: lexora-buddy-deb
          path: artifacts
      - name: Prepare makepkg user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build and install Arch package
        working-directory: packaging/buddy/aur/lexora-buddy-bin
        run: |
          deb_path="$(find "$GITHUB_WORKSPACE/artifacts" -maxdepth 1 -name 'Lexora-Buddy-*-linux-amd64.deb' -print -quit)"
          deb_sha256="$(sha256sum "$deb_path" | cut -d ' ' -f 1)"
          sudo -u builder env \
            LEXORA_BUDDY_DEB_URL="file://$deb_path" \
            LEXORA_BUDDY_DEB_SHA256="$deb_sha256" \
            makepkg -si --noconfirm --needed
      - name: Smoke installed Desktop utility runtime and pet entrypoints
        env:
          LEXORA_BUDDY_PET_PATH: /opt/Lexora Buddy/resources/native-pet/lexora-buddy-pet
          LEXORA_DESKTOP_EXECUTABLE_PATH: /opt/Lexora Buddy/lexora-buddy
        run: |
          smoke_root="$RUNNER_TEMP/lexora-buddy-arch-smoke"
          install -d -m 700 -o builder -g builder "$smoke_root" "$smoke_root/runtime"
          sudo -u builder "/opt/Lexora Buddy/resources/native-pet/lexora-buddy-pet" \
            --buddy-native-pet-smoke-check
          sudo -u builder env \
            HOME=/home/builder \
            LEXORA_BUDDY_PET_PATH="$LEXORA_BUDDY_PET_PATH" \
            LEXORA_DESKTOP_EXECUTABLE_PATH="$LEXORA_DESKTOP_EXECUTABLE_PATH" \
            PATH="$PATH" \
            XDG_RUNTIME_DIR="$smoke_root/runtime" \
            dbus-run-session -- node packaging/buddy/ci/run-gui-smoke.mjs
