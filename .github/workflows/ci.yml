name: Lexora CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: lexora-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      buddy: ${{ steps.resolve.outputs.buddy }}
      docs: ${{ steps.resolve.outputs.docs }}
      quality: ${{ steps.resolve.outputs.quality }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Resolve change scope
        id: resolve
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MODE: ${{ github.event_name == 'pull_request' && 'pull-request' || 'push' }}
        run: >-
          node infrastructure/scripts/resolve-ci-scope.mjs
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --mode "$MODE"
          --github-output "$GITHUB_OUTPUT"

  docs-quality:
    name: Docs quality
    needs: scope
    if: needs.scope.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Docs dependencies
        run: pnpm --filter @haohaoxue/lexora --filter @haohaoxue/lexora-docs install --frozen-lockfile

      - name: Lint Docs
        run: pnpm --filter @haohaoxue/lexora-docs lint

      - name: Build Docs
        run: pnpm --filter @haohaoxue/lexora-docs build

  quality:
    name: Quality
    needs: scope
    if: needs.scope.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Check product versions
        run: node packaging/release/version.mjs --check

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build workspace applications
        run: pnpm --filter '!@lexora/buddy' --filter '!@haohaoxue/lexora-docs' --recursive --if-present build

  buddy-packages:
    name: Buddy packages
    needs: [scope, quality]
    if: >-
      needs.scope.outputs.buddy == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    uses: ./.github/workflows/buddy-build.yml
    with:
      upload-artifacts: false

  ci-gate:
    name: CI Gate
    needs: [scope, docs-quality, quality, buddy-packages]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require selected checks
        env:
          BUDDY_REQUIRED: >-
            ${{ needs.scope.outputs.buddy == 'true'
                && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
          BUDDY_RESULT: ${{ needs.buddy-packages.result }}
          DOCS_REQUIRED: ${{ needs.scope.outputs.docs }}
          DOCS_RESULT: ${{ needs.docs-quality.result }}
          QUALITY_REQUIRED: ${{ needs.scope.outputs.quality }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: |
          require_success() {
            local label="$1"
            local required="$2"
            local result="$3"
            if [[ "$required" == "true" && "$result" != "success" ]]; then
              echo "$label did not succeed: $result" >&2
              exit 1
            fi
          }

          if [[ "$SCOPE_RESULT" != "success" ]]; then
            echo "Scope did not succeed: $SCOPE_RESULT" >&2
            exit 1
          fi

          require_success "Docs quality" "$DOCS_REQUIRED" "$DOCS_RESULT"
          require_success "Quality" "$QUALITY_REQUIRED" "$QUALITY_RESULT"
          require_success "Buddy packages" "$BUDDY_REQUIRED" "$BUDDY_RESULT"
