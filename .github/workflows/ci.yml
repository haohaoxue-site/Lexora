name: Lexora CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: lexora-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      buddy: ${{ steps.resolve.outputs.buddy }}
      contracts: ${{ steps.resolve.outputs.contracts }}
      website: ${{ steps.resolve.outputs.website }}
      quality: ${{ steps.resolve.outputs.quality }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Resolve change scope
        id: resolve
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          node infrastructure/scripts/resolve-ci-scope.mjs
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

  website-quality:
    name: Website quality
    needs: scope
    if: needs.scope.outputs.website == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Website dependencies
        run: pnpm --filter @haohaoxue/lexora --filter @haohaoxue/lexora-website install --frozen-lockfile

      - name: Verify Website Pages workflow
        run: node packaging/website/release/verify-pages-workflow.mjs

      - name: Lint Website
        run: pnpm --filter @haohaoxue/lexora-website lint

      - name: Build Website
        run: pnpm --filter @haohaoxue/lexora-website build

  quality:
    name: Quality
    needs: scope
    if: needs.scope.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Check product versions
        run: node packaging/release/version.mjs --check

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build workspace applications
        run: pnpm --filter '!@lexora/buddy' --filter '!@haohaoxue/lexora-website' --recursive --if-present build

  release-contracts:
    name: Release contracts
    needs: scope
    if: needs.scope.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Verify release contracts
        run: |
          node packaging/release/version.mjs --check
          node packaging/release/status.mjs
          node packaging/buddy/release/verify-release-workflow.mjs
          node packaging/website/release/verify-pages-workflow.mjs

  buddy-packages:
    name: Buddy packages
    needs: scope
    if: >-
      needs.scope.outputs.buddy == 'true'
      && github.event.pull_request.draft == false
    uses: ./.github/workflows/buddy-build.yml
    with:
      upload-artifacts: false

  ci-gate:
    name: CI Gate
    needs: [scope, website-quality, quality, release-contracts, buddy-packages]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require selected checks
        env:
          BUDDY_REQUIRED: >-
            ${{ needs.scope.outputs.buddy == 'true'
                && github.event.pull_request.draft == false }}
          BUDDY_RESULT: ${{ needs.buddy-packages.result }}
          CONTRACTS_REQUIRED: ${{ needs.scope.outputs.contracts }}
          CONTRACTS_RESULT: ${{ needs.release-contracts.result }}
          WEBSITE_REQUIRED: ${{ needs.scope.outputs.website }}
          WEBSITE_RESULT: ${{ needs.website-quality.result }}
          QUALITY_REQUIRED: ${{ needs.scope.outputs.quality }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: |
          require_success() {
            local label="$1"
            local required="$2"
            local result="$3"
            if [[ "$required" == "true" && "$result" != "success" ]]; then
              echo "$label did not succeed: $result" >&2
              exit 1
            fi
          }

          if [[ "$SCOPE_RESULT" != "success" ]]; then
            echo "Scope did not succeed: $SCOPE_RESULT" >&2
            exit 1
          fi

          require_success "Website quality" "$WEBSITE_REQUIRED" "$WEBSITE_RESULT"
          require_success "Quality" "$QUALITY_REQUIRED" "$QUALITY_RESULT"
          require_success "Release contracts" "$CONTRACTS_REQUIRED" "$CONTRACTS_RESULT"
          require_success "Buddy packages" "$BUDDY_REQUIRED" "$BUDDY_RESULT"
