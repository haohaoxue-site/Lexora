name: Lexora Desktop Linux Build

on:
  workflow_dispatch:
    inputs:
      upload_release_asset:
        description: Upload the verified deb to the AUR-backed GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libxdo-dev \
            rpm \
            xvfb

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Desktop Buddy Local Service and native pet
        run: pnpm check:buddy

      - name: Install built Desktop deb
        run: sudo apt-get install -y ./apps/buddy/.output/artifacts/desktop/Lexora-Buddy-*-linux-amd64.deb

      - name: Run installed Desktop and pet GUI smoke
        env:
          LEXORA_BUDDY_PET_PATH: /opt/Lexora Buddy/resources/native-pet/lexora-buddy-pet
          LEXORA_DESKTOP_EXECUTABLE_PATH: /opt/Lexora Buddy/lexora-buddy
        run: node packaging/buddy/ci/run-gui-smoke.mjs

      - name: Verify AUR release asset metadata
        run: node packaging/buddy/ci/verify-linux-deb-artifact.mjs --github-env "$GITHUB_ENV"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: lexora-buddy-linux
          path: |
            apps/buddy/.output/artifacts/desktop/*.deb
            apps/buddy/.output/artifacts/pet/*.tar.gz
          if-no-files-found: error

  publish-release:
    if: ${{ inputs.upload_release_asset && github.ref == 'refs/heads/master' }}
    needs: build-linux
    runs-on: ubuntu-24.04
    environment:
      name: buddy-release
    permissions:
      contents: write
    steps:
      - name: Require the protected release branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "Release publication is restricted to refs/heads/master" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Download verified Linux packages
        uses: actions/download-artifact@v4
        with:
          name: lexora-buddy-linux
          path: apps/buddy/.output/artifacts

      - name: Reconstruct verified release metadata
        run: node packaging/buddy/ci/verify-linux-deb-artifact.mjs --github-env "$GITHUB_ENV"

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$LEXORA_BUDDY_RELEASE_TAG" --repo "$LEXORA_BUDDY_RELEASE_REPO"; then
            gh release create "$LEXORA_BUDDY_RELEASE_TAG" \
              --repo "$LEXORA_BUDDY_RELEASE_REPO" \
              --title "Lexora $LEXORA_BUDDY_RELEASE_TAG" \
              --notes "Lexora Desktop $LEXORA_BUDDY_RELEASE_TAG"
          fi

      - name: Upload AUR-backed deb to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$LEXORA_BUDDY_RELEASE_TAG" \
            "$LEXORA_BUDDY_DEB_PATH#$LEXORA_BUDDY_RELEASE_ASSET_NAME" \
            --repo "$LEXORA_BUDDY_RELEASE_REPO" \
            --clobber

      - name: Verify public AUR release asset
        run: node packaging/buddy/release/verify-remote-asset.mjs
