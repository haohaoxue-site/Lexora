name: Lexora Buddy Release

on:
  pull_request:
    paths:
      - .github/workflows/buddy-release.yml
      - .node-version
      - apps/buddy/**
      - package.json
      - packages/assets/**
      - packaging/buddy/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  push:
    branches: [master]
    paths:
      - .github/workflows/buddy-release.yml
      - .node-version
      - apps/buddy/**
      - package.json
      - packages/assets/**
      - packaging/buddy/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified Ubuntu and Arch packages
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: buddy-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libxdo-dev \
            rpm \
            xvfb

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Buddy release gate
        run: pnpm check:buddy

      - name: Install built Desktop deb
        run: sudo apt-get install -y ./apps/buddy/.output/artifacts/desktop/Lexora-Buddy-*-linux-amd64.deb

      - name: Smoke installed Desktop and native pet
        timeout-minutes: 2
        env:
          LEXORA_BUDDY_PET_PATH: /opt/lexora-buddy/resources/native-pet/lexora-buddy-pet
          LEXORA_DESKTOP_EXECUTABLE_PATH: /opt/lexora-buddy/lexora-buddy
        run: xvfb-run -a node packaging/buddy/ci/run-gui-smoke.mjs

      - name: Verify deb release metadata
        run: node packaging/buddy/release/verify-deb-package.mjs

      - name: Upload verified Ubuntu package
        uses: actions/upload-artifact@v4
        with:
          name: lexora-buddy-ubuntu
          path: apps/buddy/.output/artifacts/desktop/*.deb
          if-no-files-found: error

  build-arch:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install Arch build and GUI dependencies
        run: pacman -Syu --noconfirm base-devel dbus git gtk3 libarchive libxcrypt-compat xorg-server-xvfb xorg-xauth

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build first-party Arch package
        run: pnpm --filter @lexora/buddy package:arch

      - name: Install built Arch package
        run: pacman -U --noconfirm ./apps/buddy/.output/artifacts/arch/Lexora-Buddy-*-arch-x86_64.pkg.tar.zst

      - name: Prepare smoke user
        run: useradd -m buddy

      - name: Smoke installed Desktop and native pet
        timeout-minutes: 2
        env:
          LEXORA_GUI_SMOKE_NO_SANDBOX: '1'
          LEXORA_BUDDY_PET_PATH: /opt/lexora-buddy/resources/native-pet/lexora-buddy-pet
          LEXORA_DESKTOP_EXECUTABLE_PATH: /opt/lexora-buddy/lexora-buddy
        run: |
          smoke_root="$RUNNER_TEMP/lexora-buddy-arch-smoke"
          install -d -m 700 -o buddy -g buddy "$smoke_root" "$smoke_root/runtime"
          runuser -u buddy -- "/opt/lexora-buddy/resources/native-pet/lexora-buddy-pet" \
            --buddy-native-pet-smoke-check
          runuser -u buddy -- env \
            HOME=/home/buddy \
            LEXORA_BUDDY_PET_PATH="$LEXORA_BUDDY_PET_PATH" \
            LEXORA_DESKTOP_EXECUTABLE_PATH="$LEXORA_DESKTOP_EXECUTABLE_PATH" \
            PATH="$PATH" \
            XDG_RUNTIME_DIR="$smoke_root/runtime" \
            xvfb-run -a dbus-run-session -- node packaging/buddy/ci/run-gui-smoke.mjs

      - name: Upload verified Arch package
        uses: actions/upload-artifact@v4
        with:
          name: lexora-buddy-arch
          path: apps/buddy/.output/artifacts/arch/*.pkg.tar.zst
          if-no-files-found: error

  publish-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/master' }}
    needs: [build-ubuntu, build-arch]
    runs-on: ubuntu-24.04
    environment:
      name: buddy-release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Download verified Ubuntu package
        uses: actions/download-artifact@v4
        with:
          name: lexora-buddy-ubuntu
          path: apps/buddy/.output/artifacts/desktop

      - name: Download verified Arch package
        uses: actions/download-artifact@v4
        with:
          name: lexora-buddy-arch
          path: apps/buddy/.output/artifacts/arch

      - name: Reconstruct release metadata and checksums
        run: |
          node packaging/buddy/release/verify-release-artifacts.mjs \
            --github-env "$GITHUB_ENV" \
            --checksum-output "$GITHUB_WORKSPACE/apps/buddy/.output/artifacts/SHA256SUMS.txt"

      - name: Require a new release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$LEXORA_BUDDY_RELEASE_TAG" --repo "$LEXORA_BUDDY_RELEASE_REPO"; then
            echo "Release $LEXORA_BUDDY_RELEASE_TAG already exists" >&2
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$LEXORA_BUDDY_RELEASE_TAG" \
            --repo "$LEXORA_BUDDY_RELEASE_REPO" \
            --target "$GITHUB_SHA" \
            --title "Lexora Buddy $LEXORA_BUDDY_VERSION" \
            --notes "Lexora Buddy $LEXORA_BUDDY_VERSION for Ubuntu and Arch Linux." \
            --draft

      - name: Upload immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$LEXORA_BUDDY_RELEASE_TAG" \
            "$LEXORA_BUDDY_DEB_PATH#$LEXORA_BUDDY_RELEASE_ASSET_NAME" \
            "$LEXORA_BUDDY_ARCH_PATH#$LEXORA_BUDDY_ARCH_ASSET_NAME" \
            "$LEXORA_BUDDY_CHECKSUM_PATH#$LEXORA_BUDDY_CHECKSUM_ASSET_NAME" \
            --repo "$LEXORA_BUDDY_RELEASE_REPO"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$LEXORA_BUDDY_RELEASE_TAG" \
            --repo "$LEXORA_BUDDY_RELEASE_REPO" \
            --draft=false

  verify-public-assets:
    needs: publish-release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Download verified Ubuntu package
        uses: actions/download-artifact@v4
        with:
          name: lexora-buddy-ubuntu
          path: apps/buddy/.output/artifacts/desktop

      - name: Download verified Arch package
        uses: actions/download-artifact@v4
        with:
          name: lexora-buddy-arch
          path: apps/buddy/.output/artifacts/arch

      - name: Reconstruct expected public asset metadata
        run: |
          node packaging/buddy/release/verify-release-artifacts.mjs \
            --github-env "$GITHUB_ENV" \
            --checksum-output "$GITHUB_WORKSPACE/apps/buddy/.output/artifacts/SHA256SUMS.txt"

      - name: Verify public Ubuntu package
        run: node packaging/buddy/release/verify-remote-asset.mjs --asset deb

      - name: Verify public Arch package
        run: node packaging/buddy/release/verify-remote-asset.mjs --asset arch

      - name: Verify public checksum manifest
        run: node packaging/buddy/release/verify-remote-asset.mjs --asset checksums
