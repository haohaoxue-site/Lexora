[workspace]
resolver = "3"
members = [
  "host",
  "image",
  "pet"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
png = "0.18.1"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
thiserror = "2"
windows-sys = "0.61"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
